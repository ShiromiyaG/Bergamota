// A port's Android app (docs/porting.md, "Android"): sdk/android.py copies
// this folder into the port's build, fills port.properties, assets/,
// jniLibs/ and res/, and runs Gradle on it
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'port'
include ':app'
