[package]
name = "launcher"
version = "0.2.0"
edition = "2021"
publish = false
description = "A port's launcher: picks the player's own copy of one of the port's games and its update, recompiles it with 3dsrecomp, then plays it in the runtime's player. Which port, which games: port.toml"

# the package renames it after the port (Solstice.exe, Duality.exe, Tidefall.exe)
[[bin]]
name = "launcher"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
# checks the Zig downloaded when there is no C compiler
sha2 = "0.10"
toml = "0.9"
# reads the game and the update the same way Zakuro does
zakuro-fs = { git = "https://github.com/ShiromiyaG/zakuro", branch = "launcher-support" }

# a project of its own, whatever directory it sits in
[workspace]
