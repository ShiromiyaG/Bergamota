[package]
name = "zakuro-gpu-c"
description = "Zakuro's PICA200 renderer behind a C interface, for the runtime until its native renderer exists"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# software drawing, or on the host GPU through Vulkan; no OpenGL
zakuro-gpu = { path = "../../../zakuro-dev/crates/zakuro-gpu", default-features = false, features = ["jit", "vulkan"] }

[profile.release]
debug = 1
panic = "abort"
